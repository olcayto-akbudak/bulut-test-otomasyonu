[pytest]
testpaths = tests
addopts =
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    smoke: her sürümde koşan kısa kritik akışlar
    regresyon: tam regresyon seti
    edonusum: e-Fatura / e-Arşiv akışları (sadece GİB test ortamında)
